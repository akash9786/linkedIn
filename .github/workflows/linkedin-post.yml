name: LinkedIn Auto Post Auto

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:

jobs:
  linkedin_post:
    runs-on: ubuntu-latest

    steps:
      - name: Call Composio LinkedIn API
        id: post
        run: |
          curl -X POST https://api.composio.com/mcp/run/linkedin_post_java_with_ai_image-image \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.COMPOSIO_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "intent": "generate_post_ai_image_with_code_for_linkedin_java_fullstack",
            "timezone": "IST",
            "include_ai_image": true,
            "include_code_snippet": true,
            "image_style": "clean modern tech illustration about java and full-stack development"
          }'
